name: V296 preregistered four-way high-RC global-route feasibility
on:
  push:
    branches: [research/v296-pairwise-bank-conflict]
    paths:
      - 'research/v296/GLOBAL_ROUTE_FEASIBILITY_PREREG_20261024.md'
      - 'research/v296/run_global_gate.sh'
      - 'research/v296/audit_global_gate.py'
      - '.github/workflows/v296-global-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [pairwise, serial_onehot, parallel_onehot, original]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OpenROAD and Yosys
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys iverilog curl python3
          curl -fL --retry 3 --max-time 180 \
            https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb \
            -o /tmp/openroad-v296.deb
          sudo apt-get install -y /tmp/openroad-v296.deb
          mkdir -p build/v296/platform build/v296/global_gate
          sha256sum /tmp/openroad-v296.deb > build/v296/global_gate/openroad.deb.sha256
      - name: Download frozen Nangate45 and RCX calibration
        run: |
          set -euo pipefail
          rev=eda8e552974d47a12616294dddf4012d892548d3
          base="https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$rev/flow/platforms/nangate45"
          curl -fL --retry 3 --max-time 180 "$base/lib/NangateOpenCellLibrary_typical.lib" -o build/v296/nangate.lib
          for f in NangateOpenCellLibrary.tech.lef NangateOpenCellLibrary.macro.mod.lef; do
            curl -fL --retry 3 --max-time 180 "$base/lef/$f" -o "build/v296/platform/$f"
          done
          curl -fL --retry 3 --max-time 180 "$base/make_tracks.tcl" -o build/v296/platform/make_tracks.tcl
          curl -fL --retry 3 --max-time 180 "$base/rcx_patterns.rules" -o build/v296/platform/rcx_patterns.rules
          sha256sum build/v296/nangate.lib build/v296/platform/* > build/v296/global_gate/models.sha256
      - name: Independent audit self-test
        run: python3 research/v296/audit_global_gate.py --self-test
      - name: Preregistered high-RC global-route contestant
        env:
          V296_GATE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          export V296_OPENROAD_BIN="$(command -v openroad)"
          bash research/v296/run_global_gate.sh
      - name: Preserve complete and incomplete physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-global-gate-${{ matrix.variant }}
          path: build/v296/global_gate/
          if-no-files-found: warn
