name: V296 decoded RF slice paired post-CTS extracted-RC falsification
on:
  push:
    branches: [research/v296-pairwise-bank-conflict]
    paths:
      - '.github/workflows/v296-bank-decode-postcts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v296-decoded-postcts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-rtl-and-frozen-physical-protocol:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install independent RTL simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog python3
      - name: Verify fail-closed source/physical generator and independent auditor
        run: |
          set -euo pipefail
          python3 research/v296/bank_decode_postcts_flow.py --self-test --build
          python3 research/v296/bank_decode_postcts_independent_audit.py --self-test
          python3 research/v296/tile_slice_flow.py --self-test
          test -s build/v296/tile_slice/run_bank_decode_postcts.sh
          grep -q 'V296_TOP="v296_tile_slice_bank_decode"' build/v296/tile_slice/run_bank_decode_postcts.sh
          grep -q 'clock_tree_synthesis' build/v296/tile_slice/cts45_tile.tcl
          grep -q 'detailed_route -output_drc' build/v296/tile_slice/cts45_tile.tcl
          grep -q 'if {$env(V296_CONTROL_EXTRA) eq "1"}' build/v296/tile_slice/cts45_tile.tcl
      - name: Recheck frozen decoded RTL against delayed RF oracle
        run: |
          set -euo pipefail
          iverilog -g2012 -s tb_v296_tile_slice_bank_decode -o /tmp/v296_decoded_postcts.vvp \
            rtl/vtile/steal_warp_scheduler.sv \
            research/v295/v295_issue_core.sv \
            research/v296/v296_issue_core.sv \
            research/v296/v296_tile_slice.sv \
            research/v296/v296_tile_slice_return_tree.sv \
            research/v296/v296_tile_slice_operand_capture.sv \
            research/v296/v296_tile_slice_bank_decode.sv \
            research/v296/tb_v296_tile_slice_bank_decode.sv
          vvp /tmp/v296_decoded_postcts.vvp | tee /tmp/v296_decoded_postcts_rtl.log
          grep -q 'V296_BANK_DECODE_DELAYED_RTL_PASS checks=4096 delayed=2048' /tmp/v296_decoded_postcts_rtl.log
      - name: Preserve functional gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-decoded-postcts-rtl
          path: /tmp/v296_decoded_postcts_rtl.log
          if-no-files-found: warn
  paired-postcts-extracted:
    needs: verify-rtl-and-frozen-physical-protocol
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [pairwise, serial_onehot]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Yosys and OpenROAD
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys iverilog curl python3
          curl -fL --retry 3 --max-time 180 \
            https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb \
            -o /tmp/openroad-v296.deb
          sudo apt-get install -y /tmp/openroad-v296.deb
          mkdir -p build/v296/platform build/v296/tile_slice
          sha256sum /tmp/openroad-v296.deb > build/v296/tile_slice/openroad.deb.sha256
      - name: Download frozen Nangate45 and OpenRCX platform
        run: |
          set -euo pipefail
          rev=eda8e552974d47a12616294dddf4012d892548d3
          base="https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$rev/flow/platforms/nangate45"
          curl -fL --retry 3 --max-time 180 "$base/lib/NangateOpenCellLibrary_typical.lib" -o build/v296/nangate.lib
          for f in NangateOpenCellLibrary.tech.lef NangateOpenCellLibrary.macro.mod.lef; do
            curl -fL --retry 3 --max-time 180 "$base/lef/$f" -o "build/v296/platform/$f"
          done
          curl -fL --retry 3 --max-time 180 "$base/make_tracks.tcl" -o build/v296/platform/make_tracks.tcl
          curl -fL --retry 3 --max-time 180 "$base/rcx_patterns.rules" -o build/v296/platform/rcx_patterns.rules
      - name: Derive unchanged CTS and strong-control post-CTS runner
        run: |
          set -euo pipefail
          python3 research/v296/bank_decode_postcts_flow.py --self-test --build
          python3 research/v296/bank_decode_postcts_independent_audit.py --self-test
          test -s build/v296/tile_slice/bank_decode_postcts_manifest.json
          test -s build/v296/tile_slice/cts45_tile.tcl
      - name: Execute bounded matched post-CTS detailed-route extracted-RC experiment
        env:
          V296_TILE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          export V296_OPENROAD_BIN="$(command -v openroad)"
          timeout --signal=TERM --kill-after=60s 160m bash build/v296/tile_slice/run_bank_decode_postcts.sh
          python3 research/v296/bank_decode_postcts_independent_audit.py \
            --single build/v296/tile_slice "$V296_TILE_VARIANT"
          echo "V296_DECODED_POSTCTS_CONTESTANT_AUDITED $V296_TILE_VARIANT"
      - name: Preserve complete or failed physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-decoded-postcts-${{ matrix.variant }}
          path: build/v296/tile_slice/
          if-no-files-found: warn
  independent-aggregate:
    needs: [verify-rtl-and-frozen-physical-protocol, paired-postcts-extracted]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve both original contestant artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v296-decoded-postcts-*
          path: build/v296/tile_slice/
          merge-multiple: true
      - name: Fail-closed independent paired physical verdict
        run: |
          set -euo pipefail
          python3 research/v296/bank_decode_postcts_independent_audit.py --self-test
          python3 research/v296/bank_decode_postcts_independent_audit.py --aggregate build/v296/tile_slice/
      - name: Preserve negative results and incomplete outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-decoded-postcts-independent-verdict
          path: build/v296/tile_slice/aggregate.bank_decode_postcts.json
          if-no-files-found: warn
