name: V153 FP32 Cutset Pipeline
on:
  push:
    branches: ['research/fp32-cutset-pipeline-153']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - run: bash research/v153/CI.sh
      - name: Preserve raw V153 evidence including failed gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v153-cutset-pipeline-evidence
          path: build/v153/
          if-no-files-found: warn
