name: V151 Bounded Signed-Tail FP32
on:
  push:
    branches: ['research/fp32-bounded-tail-151']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - run: bash research/v151/CI.sh
      - name: Preserve V151 raw evidence including failed gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v151-bounded-fma-evidence
          path: build/v151/
          if-no-files-found: warn
