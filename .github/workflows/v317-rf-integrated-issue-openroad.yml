name: V317 integrated issue-control source versus pairwise routed physicality
on:
  push:
    branches: [research/v317-sass-provenance-gate]
    paths:
      - '.github/workflows/v317-rf-integrated-issue-openroad.yml'
      - 'research/v317/rtl/rf_integrated_issue_top.sv'
      - 'research/v317/rtl/tb_rf_integrated_issue.sv'
      - 'research/v317/rtl/rf_integrated_issue.mk'
      - 'research/v317/rtl/rf_integrated_issue.sdc'
      - 'research/v317/FROZEN_INTEGRATED_ISSUE_CONTROL_GATE_20261102.md'
  workflow_dispatch:
jobs:
  integrated-issue-route:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Source-faithful 4096-cycle integrated RTL equivalence
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          mkdir -p build/v317/integrated_issue
          git rev-parse HEAD | tee build/v317/integrated_issue/source_sha.txt
          iverilog -g2012 -s tb_rf_integrated_issue -o build/v317/integrated_issue/issue_tb \
            rtl/vtile/steal_warp_scheduler.sv \
            rtl/vtile/issue_control.sv \
            rtl/vtile/rf_bank_arbiter.sv \
            research/v317/rtl/rf_bank_pairwise_credit.sv \
            research/v317/rtl/rf_integrated_issue_top.sv \
            research/v317/rtl/tb_rf_integrated_issue.sv
          vvp build/v317/integrated_issue/issue_tb | tee build/v317/integrated_issue/rtl_simulation.log
      - name: Pin official ORFS container
        run: |
          set -euo pipefail
          image='openroad/orfs@sha256:9bd99a4657f491615a5a516a8de3352f8b82013a7d0788e0b244c233efd9f5b8'
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | tee build/v317/integrated_issue/container_digests.json
          printf '%s\n' "$image" > build/v317/integrated_issue/pinned_image.txt
      - name: Matched source and pairwise complete physical route
        run: |
          set +e
          set -uo pipefail
          image='openroad/orfs@sha256:9bd99a4657f491615a5a516a8de3352f8b82013a7d0788e0b244c233efd9f5b8'
          failed=0
          for variant in source pairwise; do
            name="vektor_v317_issue_integrated_top_${variant}"
            label="integrated_${variant}"
            for dir in results logs reports objects; do
              mkdir -p "build/v317/integrated_issue/${label}/${dir}/nangate45/${name}/base"
            done
            echo "ROUTE START ${label}" | tee "build/v317/integrated_issue/${label}/status.txt"
            docker run --rm \
              -v "$PWD:/work/vektor" \
              -e VEKTOR_ROOT=/work/vektor \
              -w /OpenROAD-flow-scripts/flow \
              "$image" bash -lc "source ../env.sh && make DESIGN_CONFIG=/work/vektor/research/v317/rtl/rf_integrated_issue.mk DESIGN_NAME=${name} DIE_AREA='0 0 120 120' CORE_AREA='4 4 116 116' FLOW_VARIANT=base WORK_HOME=/work/vektor/build/v317/integrated_issue/${label} -j1" \
              > "build/v317/integrated_issue/${label}/make.log" 2>&1
            rc=$?
            echo "exit_code=${rc}" | tee -a "build/v317/integrated_issue/${label}/status.txt"
            if [ "$rc" -ne 0 ]; then
              failed=1
              tail -n 100 "build/v317/integrated_issue/${label}/make.log" || true
            fi
          done
          exit "$failed"
      - name: Preserve successful and failed physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v317-integrated-issue-nangate45-route
          path: build/v317/integrated_issue/
          retention-days: 30
