name: V309 per-warp interleaving sensitivity falsification
on:
  push:
    branches:
      - research/v309-external-ptx-bottleneck-gate
    paths:
      - research/v309/interleaving_sensitivity.py
      - research/v309/INTERLEAVING_SENSITIVITY_PROTOCOL_20261030.md
      - .github/workflows/v309-interleaving-sensitivity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interleaving:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen win/no-win regimes and independent reference oracle
        run: python3 research/v309/interleaving_sensitivity.py --selftest
      - name: Acquire SHA-256-authenticated V100 historical traces
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 2 --retry-delay 3 \
            --connect-timeout 25 --max-time 240 --max-filesize 67108864 \
            'https://engineering.purdue.edu/tgrogers/accel-sim/traces/tesla-v100/2020.03.18/rodinia_2.0-ft.tgz' \
            -o /tmp/v309-v100-rodinia.tgz
          echo 'aeb7de478785856e4ac834d12be0e71ab0df297f43fc02650e2ca90dea66d8b1  /tmp/v309-v100-rodinia.tgz' | sha256sum -c -
      - name: Preserve stream order and vary cross-stream interleaving
        run: python3 research/v309/interleaving_sensitivity.py /tmp/v309-v100-rodinia.tgz --output v309-interleaving-sensitivity.json
      - name: Independent cross-file, cross-application and prior-result checks
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('v309-interleaving-sensitivity.json'))
          assert x['status']=='PASS' and x['producer_identity_verified'] is False
          assert x['physical_schedule_validated'] is False
          g=x['global']; files=x['files']; apps=x['applications']
          assert len(files)==210 and len(apps)==11
          assert tuple(g[k] for k in ('global_proxy','ldg_rows','certified_rows','line_references','unique_lines'))==(240465,197197,190219,530930,159345)
          assert x['selftest']['independent_lru_oracle_checks']>=9000
          for k in ('ldg_rows','line_references','unique_lines'):
              assert sum(f[k] for f in files)==g[k]
              assert sum(a[k] for a in apps.values())==g[k]
          for schedule in ('recorded','serial','round_robin'):
              for mode in ('skip','flush'):
                  for c in (4,16,64,256):
                      k=str(c); value=g['misses'][schedule][mode][k]
                      assert value==sum(f['misses'][schedule][mode][k] for f in files)
                      assert value==sum(a['misses'][schedule][mode][k] for a in apps.values())
                      assert g['unique_lines']<=value<=g['line_references']
                  assert g['misses'][schedule][mode]['4']>=g['misses'][schedule][mode]['16']>=g['misses'][schedule][mode]['64']>=g['misses'][schedule][mode]['256']
              for c in (4,16,64,256):
                  k=str(c)
                  assert g['misses'][schedule]['skip'][k]<=g['misses'][schedule]['flush'][k]
          assert g['misses']['recorded']['skip']['64']==175042
          assert g['misses']['recorded']['flush']['64']==202939
          print('PASS: exact full-corpus conservation, prior-replay equality, independent oracle')
          for mode in ('skip','flush'):
              for c in (4,16,64,256):
                  print(mode,c,[(s,g['misses'][s][mode][str(c)]) for s in ('recorded','serial','round_robin')])
          print('NOT GPU cache misses, physical schedule, DRAM transactions or throughput')
          PY
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v309-interleaving-sensitivity-conditional
          path: v309-interleaving-sensitivity.json
          if-no-files-found: warn
