name: V301 controls, frozen set4 falsification, bounded saturation, and RTL
on:
  push:
    branches: [research/v301-epoch-safe-scoreboard-coalescer]
  pull_request:
    paths: [research/v301/**, .github/workflows/v301-pilot.yml]
jobs:
  v301-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and independent conservation checks
        run: |
          python research/v301/scoreboard.py --selftest
          python research/v301/independent_audit.py
          python research/v301/bounded_backpressure.py --selftest
      - name: Reproduce opened pilot only
        run: python research/v301/scoreboard.py > v301-pilot.json
      - name: Execute frozen N1-N4 four-way control experiment
        run: python research/v301/set4_holdout.py > v301-set4-holdout.json
      - name: Reproduce bounded-source saturation sensitivity
        run: python research/v301/bounded_backpressure.py > v301-bounded-saturation.json
      - name: Print prospective decision
        run: cat v301-set4-holdout.json
      - name: Install Icarus and Yosys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog yosys
      - name: Clocked RTL versus independent oracle
        run: |
          set -eu
          python3 research/v301/v301_rtl_oracle.py
          for variant in 0 1; do
            iverilog -g2012 -s tb_v301_rtl -Ptb_v301_rtl.FULL_CAM=$variant -o /tmp/v301_${variant}.vvp research/v301/v301_scoreboard_rtl.v research/v301/tb_v301_rtl.v
            vvp /tmp/v301_${variant}.vvp
          done
      - name: Matched pinned Nangate45 mapped synthesis
        run: |
          set -eu
          mkdir -p v301-rtl-logs
          REV=eda8e552974d47a12616294dddf4012d892548d3
          curl -fL --retry 3 --max-time 180 "https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$REV/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib" -o /tmp/v301_nangate.lib
          sha256sum /tmp/v301_nangate.lib | tee v301-rtl-logs/liberty.sha256
          for variant in 0 1; do
            yosys -Q -T -l v301-rtl-logs/nangate_${variant}.log -p "read_liberty -lib -ignore_miss_func -ignore_miss_dir /tmp/v301_nangate.lib; read_verilog research/v301/v301_scoreboard_rtl.v; hierarchy -top v301_scoreboard_rtl -chparam FULL_CAM $variant; synth -top v301_scoreboard_rtl -flatten; dfflibmap -liberty /tmp/v301_nangate.lib; abc -liberty /tmp/v301_nangate.lib; clean; check -assert; stat -liberty /tmp/v301_nangate.lib"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v301-pilot-set4-bounded-and-rtl
          path: |
            v301-pilot.json
            v301-set4-holdout.json
            v301-bounded-saturation.json
            v301-rtl-logs/
