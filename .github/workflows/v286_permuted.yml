name: V286 permuted hash gate
on:
  push:
    branches: ["research/warp-salted-rf-bank-286-20261022"]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - run: mkdir -p build/v286perm && iverilog -g2012 -s tb_v286_permuted -o build/v286perm/tb research/v286/v286_permuted_map.sv research/v286/tb_v286_permuted.sv && vvp build/v286perm/tb
      - run: curl -fsSL https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/master/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib -o build/v286perm/lib.lib
      - run: yosys -p 'read_liberty -lib build/v286perm/lib.lib; read_verilog -sv research/v286/v286_permuted_map.sv; synth -top v286_permuted_bank_map -noabc; abc -liberty build/v286perm/lib.lib; stat -liberty build/v286perm/lib.lib; ltp -noff' > build/v286perm/perm.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v286-permuted-physical
          path: build/v286perm/
