name: V317 matched dual-read RF proxy integrated physical gate
on:
  push:
    branches: [research/v317-sass-provenance-gate]
    paths:
      - '.github/workflows/v317-rf-proxy-integrated-openroad.yml'
      - 'research/v317/rtl/rf_proxy_banked_tile.sv'
      - 'research/v317/rtl/tb_rf_proxy_banked_tile.sv'
      - 'research/v317/rtl/rf_proxy_banked_tile.mk'
      - 'research/v317/rtl/rf_proxy_banked_tile.sdc'
      - 'research/v317/FROZEN_BANKED_RF_PROXY_TILE_GATE_20261102.md'
  workflow_dispatch:
jobs:
  rf-proxy-route:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Source-faithful 4096-cycle RTL and two-read-port legality
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          mkdir -p build/v317/rf_proxy
          git rev-parse HEAD | tee build/v317/rf_proxy/source_sha.txt
          iverilog -g2012 -s tb_rf_proxy_banked_tile -o build/v317/rf_proxy/tb \
            rtl/vtile/steal_warp_scheduler.sv \
            rtl/vtile/issue_control.sv \
            rtl/vtile/rf_bank_arbiter.sv \
            research/v317/rtl/rf_bank_pairwise_credit.sv \
            research/v317/rtl/rf_integrated_issue_top.sv \
            research/v317/rtl/rf_proxy_banked_tile.sv \
            research/v317/rtl/tb_rf_proxy_banked_tile.sv
          vvp build/v317/rf_proxy/tb | tee build/v317/rf_proxy/rtl.log
          grep -q 'PASS V317 banked RF proxy cycles=4096' build/v317/rf_proxy/rtl.log
      - name: Pin official OpenROAD ORFS container
        run: |
          set -euo pipefail
          image='openroad/orfs@sha256:9bd99a4657f491615a5a516a8de3352f8b82013a7d0788e0b244c233efd9f5b8'
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | tee build/v317/rf_proxy/container_digests.json
          printf '%s\n' "$image" > build/v317/rf_proxy/pinned_image.txt
      - name: Equal-resource source and pairwise complete physical route
        run: |
          set +e
          set -uo pipefail
          image='openroad/orfs@sha256:9bd99a4657f491615a5a516a8de3352f8b82013a7d0788e0b244c233efd9f5b8'
          failed=0
          for variant in source pairwise; do
            name="vektor_v317_rf_proxy_top_${variant}"
            label="rf_proxy_${variant}"
            for dir in results logs reports objects; do
              mkdir -p "build/v317/rf_proxy/${label}/${dir}/nangate45/${name}/base"
            done
            echo "ROUTE START ${label}" | tee "build/v317/rf_proxy/${label}/status.txt"
            docker run --rm \
              -v "$PWD:/work/vektor" \
              -e VEKTOR_ROOT=/work/vektor \
              -w /OpenROAD-flow-scripts/flow \
              "$image" bash -lc "source ../env.sh && make DESIGN_CONFIG=/work/vektor/research/v317/rtl/rf_proxy_banked_tile.mk DESIGN_NAME=${name} DIE_AREA='0 0 240 240' CORE_AREA='8 8 232 232' FLOW_VARIANT=base WORK_HOME=/work/vektor/build/v317/rf_proxy/${label} -j1" \
              > "build/v317/rf_proxy/${label}/make.log" 2>&1
            rc=$?
            echo "exit_code=${rc}" | tee -a "build/v317/rf_proxy/${label}/status.txt"
            if [ "$rc" -ne 0 ]; then
              failed=1
              tail -n 100 "build/v317/rf_proxy/${label}/make.log" || true
            fi
          done
          exit "$failed"
      - name: Preserve successful and failed RTL and routed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v317-rf-proxy-matched-nangate45
          path: build/v317/rf_proxy/
          retention-days: 30
