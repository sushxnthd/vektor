name: V309 bounded external V100 SASS trace acquisition
on:
  push:
    branches:
      - research/v309-external-ptx-bottleneck-gate
    paths:
      - research/v309/v100_trace_inventory.py
      - research/v309/V100_TRACE_ACQUISITION_PROTOCOL_20261030.md
      - .github/workflows/v309-v100-trace-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent synthetic fixtures and fail-closed negative mutants
        run: python3 research/v309/v100_trace_inventory.py --selftest > v309-v100-selftest.json
      - name: Download one published V100 Rodinia trace archive within 64 MiB
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 2 --retry-delay 3 \
            --connect-timeout 25 --max-time 240 --max-filesize 67108864 \
            'https://engineering.purdue.edu/tgrogers/accel-sim/traces/tesla-v100/2020.03.18/rodinia_2.0-ft.tgz' \
            -o /tmp/v309-v100-rodinia.tgz
          test "$(stat -c%s /tmp/v309-v100-rodinia.tgz)" -le 67108864
          sha256sum /tmp/v309-v100-rodinia.tgz
      - name: Bounded authentic archive inventory, no extraction
        run: |
          python3 research/v309/v100_trace_inventory.py /tmp/v309-v100-rodinia.tgz --expected-sha256 aeb7de478785856e4ac834d12be0e71ab0df297f43fc02650e2ca90dea66d8b1 > v309-v100-inventory.json
          python3 - <<'PY'
          import json
          d=json.load(open('v309-v100-inventory.json'))
          assert d['archive_bytes'] <= 64*1024*1024
          assert len(d['archive_sha256']) == 64
          assert d['sampled_trace_members'] <= 24
          assert d['qualification'] in (
              'NO_TRACE_MEMBERS', 'TRACE_FORMAT_UNRESOLVED',
              'AUTHENTIC_TRACE_PREFIXES_ONLY_NOT_PERFORMANCE_VALIDATION')
          print(json.dumps({k:d[k] for k in (
              'archive_sha256','archive_bytes','member_count',
              'trace_member_count','trace_bytes_declared',
              'sampled_rows_matching_old_nvbit_format','qualification')},indent=2))
          PY
      - name: Preserve raw bounded external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v309-authentic-v100-trace-inventory
          path: |
            v309-v100-selftest.json
            v309-v100-inventory.json
          if-no-files-found: warn
