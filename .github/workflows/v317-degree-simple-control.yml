name: v317-degree-simple-control
on:
  push:
    branches: [research/v317-sass-provenance-gate]
    paths:
      - 'research/v317/rtl/degree_head_simple_control.sv'
      - 'research/v317/rtl/tb_degree_head_simple_control.sv'
      - 'research/v317/rtl/audit_degree_head_exhaustive.py'
      - 'research/v317/FROZEN_DEGREE_RTL_CHALLENGE_20261103.md'
      - '.github/workflows/v317-degree-simple-control.yml'
  pull_request:
    paths:
      - 'research/v317/rtl/degree_head_simple_control.sv'
      - 'research/v317/rtl/tb_degree_head_simple_control.sv'
      - 'research/v317/rtl/audit_degree_head_exhaustive.py'
      - 'research/v317/FROZEN_DEGREE_RTL_CHALLENGE_20261103.md'
      - '.github/workflows/v317-degree-simple-control.yml'
  workflow_dispatch:
jobs:
  verify-and-synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install independent open RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Exhaustive independent 2/3-bank checker
        run: |
          mkdir -p /tmp/v317-degree
          python3 research/v317/rtl/audit_degree_head_exhaustive.py > /tmp/v317-degree/exhaustive.json
          python3 -m json.tool /tmp/v317-degree/exhaustive.json > /dev/null
      - name: Exhaustive 2-bank RTL and frozen 3-bank counterexamples
        run: |
          iverilog -g2012 -s tb_v317_degree_head -o /tmp/v317-degree/tb \
            research/v317/rtl/compact_greedy_equal_policy.sv \
            research/v317/rtl/degree_head_simple_control.sv \
            research/v317/rtl/tb_degree_head_simple_control.sv
          vvp /tmp/v317-degree/tb | tee /tmp/v317-degree/rtl-simulation.txt
      - name: Identical generic Yosys synthesis of both controllers
        run: |
          yosys -p 'read_verilog -sv research/v317/rtl/compact_greedy_equal_policy.sv; synth -top vektor_v309_compact_greedy_arbiter; stat' > /tmp/v317-degree/compact-yosys.log
          yosys -p 'read_verilog -sv research/v317/rtl/compact_greedy_equal_policy.sv research/v317/rtl/degree_head_simple_control.sv; synth -top vektor_v317_degree_head_arbiter; stat' > /tmp/v317-degree/degree-yosys.log
          grep 'number of cells\|Number of cells' /tmp/v317-degree/*yosys.log | tail -8
      - name: Preserve raw checker and synthesis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v317-degree-rtl-independent-check
          path: /tmp/v317-degree/
