name: V317 exact bank-partition law transfer
on:
  push:
    branches: [research/v317-sass-provenance-gate]
    paths:
      - 'research/v317/rtl/exact_bank_opportunity_polynomial.py'
      - 'research/v317/rtl/exact_bank_partition_transfer.py'
      - 'research/v317/rtl/audit_exact_bank_partition_transfer.py'
      - 'research/v317/rtl/replay_bank_scaling_clock_envelope.py'
      - 'research/v317/rtl/audit_replay_bank_scaling_clock_envelope.py'
      - '.github/workflows/v317-exact-bank-partition-law.yml'
  workflow_dispatch:
jobs:
  exact-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Derive exact coefficients and replay both frozen protocols
        run: |
          python -m research.v317.rtl.exact_bank_opportunity_polynomial > /tmp/v317-exact-polynomial.json
          python -m research.v317.rtl.exact_bank_partition_transfer > /tmp/v317-exact-transfer.json
          python research/v317/rtl/audit_exact_bank_partition_transfer.py /tmp/v317-exact-transfer.json > /tmp/v317-exact-audit.json
          python -m research.v317.rtl.replay_bank_scaling_clock_envelope > /tmp/v317-bank-scaling.json
          python -m research.v317.rtl.audit_replay_bank_scaling_clock_envelope /tmp/v317-bank-scaling.json > /tmp/v317-bank-scaling-audit.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/v317-exact-audit.json'))
          b=json.load(open('/tmp/v317-bank-scaling-audit.json'))
          assert a['status']=='PASS' and b['status']=='PASS'
          assert all(a['predictions'].values()), a
          p=json.load(open('/tmp/v317-exact-polynomial.json'))
          assert p['leading_event_coefficient_b_inverse_square']==4
          print(a,b)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v317-exact-bank-partition-law
          path: /tmp/v317-*.json
