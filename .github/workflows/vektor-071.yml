name: Vektor-071 bounded fabric conservation
on:
  push:
    branches:
      - research/bounded-router-conservation-071
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install open HDL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Independent model regression
        run: python3 research/071/model/model_071.py
      - name: Router directed RTL test
        run: |
          iverilog -g2012 -s tb_fabric_071 -o /tmp/fabric071 research/071/rtl/bounded_fabric_071.sv research/071/rtl/tb_fabric_071.sv
          vvp /tmp/fabric071
      - name: End-to-end sender/router/receiver RTL test
        run: |
          iverilog -g2012 -s tb_integrated_071 -o /tmp/int071 research/071/rtl/bounded_fabric_071.sv research/070/rtl/reliable_sender_069.sv research/070/rtl/receiver_dedup_070.sv research/071/rtl/tb_integrated_071.sv
          vvp /tmp/int071
      - name: Generic synthesis of router
        run: yosys -Q -p 'read_verilog -sv research/071/rtl/bounded_fabric_071.sv; hierarchy -top bounded_fabric_071; proc; opt; synth -top bounded_fabric_071; stat'
