name: rtl

on:
  push:
    branches: [main, "research/**"]
  pull_request:

jobs:
  verify-and-synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install open RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Simulate fixed-partition wave scheduler
        run: |
          mkdir -p build/rtl
          iverilog -g2012 -s tb_warp_scheduler \
            -o build/rtl/tb_warp_scheduler \
            rtl/vtile/warp_scheduler.sv verification/rtl/tb_warp_scheduler.sv
          vvp build/rtl/tb_warp_scheduler
      - name: Simulate global wave scheduler
        run: |
          iverilog -g2012 -s tb_global_warp_scheduler \
            -o build/rtl/tb_global_warp_scheduler \
            rtl/vtile/global_warp_scheduler.sv verification/rtl/tb_global_warp_scheduler.sv
          vvp build/rtl/tb_global_warp_scheduler
      - name: Simulate limited work-stealing scheduler
        run: |
          iverilog -g2012 -s tb_steal_warp_scheduler \
            -o build/rtl/tb_steal_warp_scheduler \
            rtl/vtile/steal_warp_scheduler.sv verification/rtl/tb_steal_warp_scheduler.sv
          vvp build/rtl/tb_steal_warp_scheduler
      - name: Simulate RF bank arbiter
        run: |
          iverilog -g2012 -s tb_rf_bank_arbiter \
            -o build/rtl/tb_rf_bank_arbiter \
            rtl/vtile/rf_bank_arbiter.sv verification/rtl/tb_rf_bank_arbiter.sv
          vvp build/rtl/tb_rf_bank_arbiter
      - name: Simulate integrated issue control
        run: |
          iverilog -g2012 -s tb_issue_control \
            -o build/rtl/tb_issue_control \
            rtl/vtile/steal_warp_scheduler.sv \
            rtl/vtile/rf_bank_arbiter.sv \
            rtl/vtile/issue_control.sv \
            verification/rtl/tb_issue_control.sv
          vvp build/rtl/tb_issue_control
      - name: Generic synthesis — fixed wave scheduler
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv rtl/vtile/warp_scheduler.sv; synth -top vektor_warp_scheduler; stat' 2>&1 \
            | tee build/rtl/warp_scheduler_yosys.log
      - name: Generic synthesis — global wave scheduler
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv rtl/vtile/global_warp_scheduler.sv; synth -top vektor_global_warp_scheduler; stat' 2>&1 \
            | tee build/rtl/global_warp_scheduler_yosys.log
      - name: Generic synthesis — limited work-stealing scheduler
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv rtl/vtile/steal_warp_scheduler.sv; synth -top vektor_steal_warp_scheduler; stat' 2>&1 \
            | tee build/rtl/steal_warp_scheduler_yosys.log
      - name: Generic synthesis — RF bank arbiter
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv rtl/vtile/rf_bank_arbiter.sv; synth -top vektor_rf_bank_arbiter; stat' 2>&1 \
            | tee build/rtl/rf_bank_arbiter_yosys.log
      - name: Generic synthesis — integrated issue control
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv rtl/vtile/steal_warp_scheduler.sv rtl/vtile/rf_bank_arbiter.sv rtl/vtile/issue_control.sv; synth -top vektor_issue_control; stat' 2>&1 \
            | tee build/rtl/issue_control_yosys.log
      - name: Capture RTL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-fp32-001-rtl
          path: build/rtl/

      - name: Vektor-068 producer-closure RTL simulation
        run: |
          iverilog -g2012 -s tb_ack_closure_068 -o /tmp/v068.vvp research/068/rtl/*.sv
          vvp /tmp/v068.vvp
      - name: Vektor-068 producer-closure generic synthesis
        run: |
          yosys -Q -T -p 'read_verilog -sv research/068/rtl/ack_closure_068.sv; hierarchy -check -top ack_closure_068; proc; opt; techmap; opt; check; stat'
