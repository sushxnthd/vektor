name: V296 matched mapped STA and RC sensitivity
on:
  push:
    branches: [research/v296-pairwise-bank-conflict]
  workflow_dispatch:
jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesis, STA build tools and Nangate45 Liberty
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys iverilog curl git build-essential cmake swig bison flex tcl-dev libeigen3-dev zlib1g-dev libfmt-dev
          mkdir -p build/v296/tools
          curl -fL --retry 3 --max-time 180 https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/master/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib -o build/v296/nangate.lib
          sha256sum build/v296/nangate.lib > build/v296/nangate.sha256
      - name: Build open-source OpenSTA and CUDD (record exact revisions)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.0.0 https://github.com/cuddorg/cudd.git build/v296/tools/cudd
          git -C build/v296/tools/cudd rev-parse HEAD > build/v296/tools/cudd.sha
          (cd build/v296/tools/cudd && ./configure --prefix="$PWD/install" && make -j2 && make install)
          git clone --depth 1 https://github.com/parallaxsw/OpenSTA.git build/v296/tools/opensta
          git -C build/v296/tools/opensta rev-parse HEAD > build/v296/tools/opensta.sha
          cmake -S build/v296/tools/opensta -B build/v296/tools/opensta-build -DCMAKE_BUILD_TYPE=Release -DCUDD_DIR="$PWD/build/v296/tools/cudd/install"
          cmake --build build/v296/tools/opensta-build --parallel 2
          test -x build/v296/tools/opensta-build/sta
      - name: Matched RTL simulation
        run: |
          set -euo pipefail
          iverilog -g2012 -s tb_v296 -o build/v296/tb rtl/vtile/steal_warp_scheduler.sv rtl/vtile/rf_bank_arbiter.sv rtl/vtile/issue_control.sv research/v295/v295_issue_core.sv research/v296/v296_issue_core.sv research/v296/tb_v296.sv
          vvp build/v296/tb | tee build/v296/rtl.log
      - name: Synthesize all three controllers and run constrained STA
        run: |
          set -euo pipefail
          export V296_STA_BIN="$PWD/build/v296/tools/opensta-build/sta"
          bash research/v296/run_sta.sh
      - name: Preserve all evidence including negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-matched-sta-rc
          path: |
            build/v296/sta/
            build/v296/rtl.log
            build/v296/nangate.sha256
            build/v296/tools/cudd.sha
            build/v296/tools/opensta.sha
          if-no-files-found: warn
