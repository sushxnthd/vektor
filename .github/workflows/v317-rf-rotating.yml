name: v317 rotating-priority strong control RTL and transfer
on:
  push:
    branches:
      - research/v317-sass-provenance-gate
  pull_request:
    paths:
      - 'research/v317/rtl/rf_bank_rotating_control.sv'
      - 'research/v317/rtl/tb_rf_bank_rotating.sv'
      - 'research/v317/rtl/parse_rf_rotating_cost.py'
      - 'research/v317/rf_rotating_transfer.py'
      - '.github/workflows/v317-rf-rotating.yml'
jobs:
  rotating-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install free RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Independent exhaustive four-phase RTL oracle
        run: |
          set -euo pipefail
          mkdir -p build/v317/rf_rotating
          iverilog -g2012 -s tb_v317_rf_bank_rotating -o build/v317/rf_rotating/tb \
            rtl/vtile/rf_bank_arbiter.sv \
            research/v317/rtl/rf_bank_rotating_control.sv \
            research/v317/rtl/tb_rf_bank_rotating.sv
          vvp build/v317/rf_rotating/tb | tee build/v317/rf_rotating/rtl.log
      - name: Matched generic synthesis for all three policies
        run: |
          set -euo pipefail
          yosys -p 'read_verilog -sv rtl/vtile/rf_bank_arbiter.sv; synth -flatten -top vektor_rf_bank_arbiter; stat; ltp -noff; write_json build/v317/rf_rotating/fixed.json' 2>&1 | tee build/v317/rf_rotating/fixed.log
          yosys -p 'read_verilog -sv rtl/vtile/rf_bank_arbiter.sv research/v317/rtl/rf_bank_rotating_control.sv; synth -flatten -top vektor_v317_rf_rotating; stat; ltp -noff; write_json build/v317/rf_rotating/rotating.json' 2>&1 | tee build/v317/rf_rotating/rotating.log
          yosys -p 'read_verilog -sv research/v317/rtl/rf_bank_exact_challenger.sv; synth -flatten -top vektor_v317_rf_bank_exact; stat; ltp -noff; write_json build/v317/rf_rotating/exact.json' 2>&1 | tee build/v317/rf_rotating/exact.log
      - name: Compare all cells, flops, fanout and depth
        run: |
          set -euo pipefail
          python -m research.v317.rtl.parse_rf_rotating_cost \
            build/v317/rf_rotating/fixed.json build/v317/rf_rotating/fixed.log \
            build/v317/rf_rotating/rotating.json build/v317/rf_rotating/rotating.log \
            build/v317/rf_rotating/exact.json build/v317/rf_rotating/exact.log \
            | tee build/v317/rf_rotating/cost.json
          python -m json.tool build/v317/rf_rotating/cost.json >/dev/null
      - name: Frozen unseen streaming transfer against strong controls
        run: |
          set -euo pipefail
          python -m research.v317.rf_rotating_transfer > build/v317/rf_rotating/unseen_transfer.json
          python -m json.tool build/v317/rf_rotating/unseen_transfer.json >/dev/null
          python - <<'PY'
          import json
          x = json.load(open('build/v317/rf_rotating/unseen_transfer.json'))
          for name, regime in x['regimes'].items():
              print(name, 'rotation/fixed', regime['rotation_over_fixed_completed_ratio'])
              for policy, result in regime['results'].items():
                  assert result['offered'] >= result['completed_total']
                  print(' ', policy, 'completed', result['completed_after_warmup'], 'backlog', result['backlog_total'], 'p99', result['latency_p99_cycles'])
          PY
      - name: Independent full-stream cross-check of all unseen results
        run: |
          set -euo pipefail
          python -m research.v317.rf_rotating_independent_audit \\
            build/v317/rf_rotating/unseen_transfer.json \\
            | tee build/v317/rf_rotating/independent_audit.json
      - name: Source pin
        if: always()
        run: |
          mkdir -p build/v317/rf_rotating
          git rev-parse HEAD > build/v317/rf_rotating/commit.txt
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v317-rf-rotating-physical-and-transfer
          path: build/v317/rf_rotating/
