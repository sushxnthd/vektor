name: v317 forwarding freshness RTL
on:
  push:
    branches:
      - research/v317-sass-provenance-gate
  pull_request:
    paths:
      - 'research/v317/rtl/**'
      - 'research/v317/freshness_gate.py'
      - 'research/v317/test_freshness_gate.py'
      - '.github/workflows/v317-forwarding-rtl.yml'
jobs:
  semantic-and-generic-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install open RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Independent semantic world audit
        run: |
          mkdir -p build/v317
          python -m unittest research.v317.test_freshness_gate -v
          python -m research.v317.freshness_gate > build/v317/forwarding_freshness.json
          python -m json.tool build/v317/forwarding_freshness.json > /dev/null
      - name: Simulate forwarding RTL
        run: |
          iverilog -g2012 -s tb_v317_forwarding_gate -o build/v317/tb_forwarding_gate research/v317/rtl/forwarding_gate.sv research/v317/rtl/tb_forwarding_gate.sv
          vvp build/v317/tb_forwarding_gate | tee build/v317/forwarding_sim.log
      - name: Generic synthesis and logic depth (not physical signoff)
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv research/v317/rtl/forwarding_gate.sv; synth -top vektor_v317_forwarding_gate; stat; ltp -noff' 2>&1 | tee build/v317/forwarding_yosys.log
      - name: Frozen parameter-width synthesis and fanout proxies
        run: |
          bash research/v317/rtl/synth_scale.sh
          python research/v317/rtl/parse_scale.py build/v317 > build/v317/scale_summary.json
          python -m json.tool build/v317/scale_summary.json > /dev/null
      - name: Independent stateful value-history audit
        run: |
          python -m unittest research.v317.test_stateful_write_monitor -v
      - name: Simulate stateful sticky write monitor
        run: |
          iverilog -g2012 -s tb_v317_stateful_forwarding -o build/v317/tb_stateful research/v317/rtl/forwarding_gate.sv research/v317/rtl/stateful_forwarding.sv research/v317/rtl/tb_stateful_forwarding.sv
          vvp build/v317/tb_stateful | tee build/v317/stateful_sim.log
      - name: Stateful storage and width-sensitive generic synthesis
        run: |
          set -o pipefail
          while read -r lanes data_bits warp_bits reg_bits bank_bits; do
            tag="${lanes}x${data_bits}"
            yosys -p "read_verilog -sv research/v317/rtl/forwarding_gate.sv research/v317/rtl/stateful_forwarding.sv; chparam -set LANES ${lanes} -set DATA_BITS ${data_bits} -set WARP_BITS ${warp_bits} -set REG_BITS ${reg_bits} -set BANK_BITS ${bank_bits} vektor_v317_stateful_forwarding; synth -flatten -top vektor_v317_stateful_forwarding; stat; ltp -noff; write_json build/v317/stateful_${tag}.json" 2>&1 | tee "build/v317/stateful_${tag}.log"
          done <<'CASES'
          4 8 2 4 2
          8 16 3 6 3
          32 32 5 8 4
          CASES
          python research/v317/rtl/parse_stateful_scale.py build/v317 > build/v317/stateful_scale_summary.json
          python -m json.tool build/v317/stateful_scale_summary.json > /dev/null
      - name: Independent hidden-write information audit
        run: |
          python -m unittest research.v317.test_monitor_coverage -v
          python -m research.v317.monitor_coverage > build/v317/monitor_coverage.json
          python -m json.tool build/v317/monitor_coverage.json > /dev/null
      - name: Simulate coverage fail-closed wrapper
        run: |
          iverilog -g2012 -s tb_v317_coverage_forwarding -o build/v317/tb_coverage research/v317/rtl/forwarding_gate.sv research/v317/rtl/stateful_forwarding.sv research/v317/rtl/coverage_forwarding.sv research/v317/rtl/coverage_forwarding_naive.sv research/v317/rtl/tb_coverage_forwarding.sv
          vvp build/v317/tb_coverage | tee build/v317/coverage_sim.log
      - name: Matched coverage-wrapper generic synthesis
        run: |
          set -o pipefail
          while read -r lanes data_bits warp_bits reg_bits bank_bits; do
            tag="${lanes}x${data_bits}"
            yosys -p "read_verilog -sv research/v317/rtl/forwarding_gate.sv research/v317/rtl/stateful_forwarding.sv research/v317/rtl/coverage_forwarding.sv; chparam -set LANES ${lanes} -set DATA_BITS ${data_bits} -set WARP_BITS ${warp_bits} -set REG_BITS ${reg_bits} -set BANK_BITS ${bank_bits} vektor_v317_coverage_forwarding; synth -flatten -top vektor_v317_coverage_forwarding; stat; ltp -noff; write_json build/v317/coverage_${tag}.json" 2>&1 | tee "build/v317/coverage_${tag}.log"
            yosys -p "read_verilog -sv research/v317/rtl/forwarding_gate.sv research/v317/rtl/stateful_forwarding.sv research/v317/rtl/coverage_forwarding_naive.sv; chparam -set LANES ${lanes} -set DATA_BITS ${data_bits} -set WARP_BITS ${warp_bits} -set REG_BITS ${reg_bits} -set BANK_BITS ${bank_bits} vektor_v317_coverage_forwarding_naive; synth -flatten -top vektor_v317_coverage_forwarding_naive; stat; ltp -noff; write_json build/v317/coverage_naive_${tag}.json" 2>&1 | tee "build/v317/coverage_naive_${tag}.log"
          done <<'CASES'
          4 8 2 4 2
          8 16 3 6 3
          32 32 5 8 4
          CASES
          python -m research.v317.rtl.parse_coverage_scale build/v317 > build/v317/coverage_scale_summary.json
          python -m json.tool build/v317/coverage_scale_summary.json > /dev/null
      - name: Independent two-write-port completeness audit
        run: |
          python -m unittest research.v317.test_dual_write_audit -v
          python -m research.v317.dual_write_audit > build/v317/dual_write_audit.json
          python -m json.tool build/v317/dual_write_audit.json > /dev/null
      - name: Exhaustive dual-write-port RTL and stale one-port witness
        run: |
          iverilog -g2012 -s tb_v317_dual_write_forwarding -o build/v317/tb_dual_write research/v317/rtl/forwarding_gate.sv research/v317/rtl/stateful_forwarding.sv research/v317/rtl/coverage_forwarding.sv research/v317/rtl/dual_write_forwarding.sv research/v317/rtl/tb_dual_write_forwarding.sv
          vvp build/v317/tb_dual_write | tee build/v317/dual_write_sim.log
      - name: Matched one-port versus dual-port generic synthesis sensitivity
        run: |
          set -o pipefail
          while read -r lanes data_bits warp_bits reg_bits bank_bits; do
            tag="${lanes}x${data_bits}"
            yosys -p "read_verilog -sv research/v317/rtl/forwarding_gate.sv research/v317/rtl/stateful_forwarding.sv research/v317/rtl/coverage_forwarding.sv; chparam -set LANES ${lanes} -set DATA_BITS ${data_bits} -set WARP_BITS ${warp_bits} -set REG_BITS ${reg_bits} -set BANK_BITS ${bank_bits} vektor_v317_coverage_forwarding; synth -flatten -top vektor_v317_coverage_forwarding; stat; ltp -noff; write_json build/v317/oneport_${tag}.json" 2>&1 | tee "build/v317/oneport_${tag}.log"
            yosys -p "read_verilog -sv research/v317/rtl/forwarding_gate.sv research/v317/rtl/dual_write_forwarding.sv; chparam -set LANES ${lanes} -set DATA_BITS ${data_bits} -set WARP_BITS ${warp_bits} -set REG_BITS ${reg_bits} -set BANK_BITS ${bank_bits} vektor_v317_dual_write_forwarding; synth -flatten -top vektor_v317_dual_write_forwarding; stat; ltp -noff; write_json build/v317/twoport_${tag}.json" 2>&1 | tee "build/v317/twoport_${tag}.log"
          done <<'CASES'
          4 8 2 4 2
          8 16 3 6 3
          32 32 5 8 4
          CASES
      - name: Source pin
        if: always()
        run: |
          git rev-parse HEAD > build/v317/commit.txt
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v317-forwarding-freshness-rtl
          path: build/v317/
