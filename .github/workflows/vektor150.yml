name: V150 Full FMA Reference
on:
  push:
    branches: ['research/fp32-full-reference-150']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - run: bash research/v150/CI.sh
      - name: Preserve V150 raw evidence, including failed gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v150-fma-reference-evidence
          path: build/v150/
          if-no-files-found: warn
