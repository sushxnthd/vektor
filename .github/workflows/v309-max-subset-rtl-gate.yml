name: V309 exact bank-subset RTL physicality prefilter

on:
  push:
    branches: ["research/v309-external-ptx-bottleneck-gate"]
    paths:
      - "rtl/vtile/max_subset_arbiter.sv"
      - "verification/rtl/tb_max_subset_arbiter.sv"
      - ".github/workflows/v309-max-subset-rtl-gate.yml"
  workflow_dispatch:

jobs:
  exact-subset-prefilter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install source-identified open RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          mkdir -p build/v309_max_subset
          iverilog -V > build/v309_max_subset/iverilog_version.txt 2>&1
          yosys -V > build/v309_max_subset/yosys_version.txt
      - name: Simulate exhaustive oracle and frozen win/no-win motifs
        shell: bash
        run: |
          set -euo pipefail
          iverilog -g2012 -s tb_max_subset_arbiter \
            -o build/v309_max_subset/tb \
            rtl/vtile/max_subset_arbiter.sv \
            rtl/vtile/rf_bank_arbiter.sv \
            verification/rtl/tb_max_subset_arbiter.sv
          vvp build/v309_max_subset/tb 2>&1 | tee build/v309_max_subset/rtl_simulation.log
          grep -q 'V309_MAX_SUBSET_ORACLE_PASS cases=104980' build/v309_max_subset/rtl_simulation.log
      - name: Synthesize same-interface incumbent and candidate
        shell: bash
        run: |
          set -euo pipefail
          yosys -p 'read_verilog -sv rtl/vtile/rf_bank_arbiter.sv; synth -top vektor_rf_bank_arbiter; stat; ltp -noff' \
            2>&1 | tee build/v309_max_subset/greedy_yosys.log
          yosys -p 'read_verilog -sv rtl/vtile/max_subset_arbiter.sv; synth -top vektor_v309_max_subset_arbiter; stat; ltp -noff' \
            2>&1 | tee build/v309_max_subset/optimal_yosys.log
      - name: Apply frozen generic-cell physicality prefilter
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          p = pathlib.Path('build/v309_max_subset')
          def parse(name):
              s = (p/name).read_text()
              matches = re.findall(r'Number of cells:\s*(\d+)', s)
              if not matches:
                  raise RuntimeError(f'missing generic cell count in {name}')
              depth = re.findall(r'length\s*=\s*(\d+)', s)
              return {'generic_cells': int(matches[-1]), 'ltp_length_if_available': int(depth[-1]) if depth else None}
          baseline = parse('greedy_yosys.log')
          candidate = parse('optimal_yosys.log')
          ratio = candidate['generic_cells']/baseline['generic_cells']
          result = {
              'source_commit': os.environ.get('GITHUB_SHA'),
              'evidence_tier': 'generic_yosys_synthesis_not_routed_physical',
              'baseline': baseline, 'candidate': candidate,
              'candidate_to_baseline_cell_ratio': ratio,
              'frozen_max_cell_ratio': 2.0,
              'preliminary_area_gate': 'PASS' if ratio <= 2 else 'FAIL_KILL_THIS_RTL',
              'clock_or_area_or_power_gain_claimed': False,
          }
          (p/'summary.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(result, indent=2))
          if ratio > 2:
              sys.exit('FROZEN_AREA_PREFILTER_FAIL: brute-force candidate exceeds 2x generic cells; do not promote')
          PY
      - name: Preserve complete logs even on a killed candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v309-max-subset-rtl-physicality-prefilter
          path: build/v309_max_subset/
          if-no-files-found: warn
