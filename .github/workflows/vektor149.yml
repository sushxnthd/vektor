name: V149 Close Gate
on:
  push:
    branches: ['research/fp32-wave32-close-round-149']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - run: bash research/v149/CI.sh
      - name: Preserve raw V149 logs and oracle vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v149-close-rtl-evidence
          path: build/v149/
          if-no-files-found: warn
