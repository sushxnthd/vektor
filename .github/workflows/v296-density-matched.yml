name: V296 matched-floorplan high-RC density falsification
on:
  push:
    branches: [research/v296-pairwise-bank-conflict]
    paths:
      - 'research/v296/DENSITY_MATCHED_FALSIFICATION_PREREG_20261024.md'
      - 'research/v296/run_density_matched.sh'
      - 'research/v296/audit_density_matched.py'
      - '.github/workflows/v296-density-matched.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  density-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [pairwise, serial_onehot, original]
        density: [d045, d065]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OpenROAD and Yosys
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys iverilog curl python3
          curl -fL --retry 3 --max-time 180 \
            https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb \
            -o /tmp/openroad-v296.deb
          sudo apt-get install -y /tmp/openroad-v296.deb
          mkdir -p build/v296/platform build/v296/density_gate
          sha256sum /tmp/openroad-v296.deb > build/v296/density_gate/openroad.deb.sha256
      - name: Download frozen Nangate45 and RCX calibration
        run: |
          set -euo pipefail
          rev=eda8e552974d47a12616294dddf4012d892548d3
          base="https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$rev/flow/platforms/nangate45"
          curl -fL --retry 3 --max-time 180 "$base/lib/NangateOpenCellLibrary_typical.lib" -o build/v296/nangate.lib
          for f in NangateOpenCellLibrary.tech.lef NangateOpenCellLibrary.macro.mod.lef; do
            curl -fL --retry 3 --max-time 180 "$base/lef/$f" -o "build/v296/platform/$f"
          done
          curl -fL --retry 3 --max-time 180 "$base/make_tracks.tcl" -o build/v296/platform/make_tracks.tcl
          curl -fL --retry 3 --max-time 180 "$base/rcx_patterns.rules" -o build/v296/platform/rcx_patterns.rules
      - name: Independent audit self-test
        run: python3 research/v296/audit_density_matched.py --self-test
      - name: Preregistered density contestant
        env:
          V296_GATE_VARIANT: ${{ matrix.variant }}
          V296_GATE_DENSITY: ${{ matrix.density }}
        run: |
          set -euo pipefail
          export V296_OPENROAD_BIN="$(command -v openroad)"
          bash research/v296/run_density_matched.sh
      - name: Preserve complete and incomplete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-density-${{ matrix.variant }}-${{ matrix.density }}
          path: build/v296/density_gate/
          if-no-files-found: warn
  independent-aggregate:
    needs: density-gate
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download all density evidence
        uses: actions/download-artifact@v4
        with:
          pattern: v296-density-*
          path: build/v296/density_gate/
          merge-multiple: true
      - name: Audit six matched physical contestants
        run: |
          python3 research/v296/audit_density_matched.py --self-test
          python3 research/v296/audit_density_matched.py --aggregate build/v296/density_gate
      - name: Preserve independent aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-density-independent-audit
          path: build/v296/density_gate/density_audit.json
          if-no-files-found: warn
