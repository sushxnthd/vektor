name: V317 exact-head demand and RTL gate
on:
  push:
    branches:
      - research/v317-sass-provenance-gate
  workflow_dispatch:
jobs:
  checker-and-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python exact-head regressions
        run: |
          set -euo pipefail
          python3 research/v317/rtl/v317_matched_trace_gate.py
          python3 research/v317/rtl/v317_demand_manifest_gate.py
          python3 research/v317/rtl/v317_prospective_boundary.py
      - name: Install RTL simulator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Independent RF operand-data and port-overflow oracle
        run: |
          set -euo pipefail
          iverilog -g2012 -s tb_v317_rf_proxy_independent_oracle -o /tmp/v317_independent_oracle research/v317/rtl/rf_proxy_banked_tile.sv research/v317/rtl/tb_v317_rf_proxy_independent_oracle.sv
          vvp /tmp/v317_independent_oracle
      - name: Existing RF-proxy matched RTL equivalence and port tests
        run: |
          set -euo pipefail
          iverilog -g2012 -s tb_rf_proxy_banked_tile -o /tmp/v317_rf_proxy_sim \
            rtl/vtile/steal_warp_scheduler.sv \
            rtl/vtile/issue_control.sv \
            rtl/vtile/rf_bank_arbiter.sv \
            research/v317/rtl/rf_bank_pairwise_credit.sv \
            research/v317/rtl/rf_integrated_issue_top.sv \
            research/v317/rtl/rf_proxy_banked_tile.sv \
            research/v317/rtl/tb_rf_proxy_banked_tile.sv
          vvp /tmp/v317_rf_proxy_sim
