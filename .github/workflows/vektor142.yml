name: Vektor-142 Wave32 multicast
on:
  push:
    branches:
      - 'research/fp32-collector-datapath-141'
      - 'research/fp32-broadcast-accounting-142'
  workflow_dispatch:
jobs:
  multicast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free HDL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Execute contract, RTL and generic synthesis
        run: bash research/v142/CI.sh
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v142-hdl-synthesis
          path: build/v142/
          if-no-files-found: ignore
