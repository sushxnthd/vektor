name: V296 density035 matched extended-route falsification
on:
  push:
    branches: [research/v296-pairwise-bank-conflict]
    paths:
      - '.github/workflows/v296-density035-extended-matched-route.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v296-density035-extended-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-frozen-protocol:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Independently verify censored-control boundary and physical provenance
        run: |
          set -euo pipefail
          python3 research/v296/density035_control_censoring_sensitivity.py --self-test --report
          python3 research/v296/v296_density035_route_ablation.py --self-test --build
          test -s research/v296/DENSITY035_EXTENDED_MATCHED_ROUTE_PREREG_20261027.md
          grep -Fq 'serial_onehot) param=0; extra=1' build/v296/tile_slice/run_bank_decode_density035.sh
          grep -Fq 'V296_PLACE_DENSITY) ne "0.35"' build/v296/tile_slice/cts45_tile_density035.tcl
          grep -Fq 'V296_PLACE_DENSITY) ne "0.45"' build/v296/tile_slice/cts45_tile.tcl
          grep -q 'V296_PLACE_DENSITY=0.35' build/v296/tile_slice/run_bank_decode_density035.sh
  matched-extended-route:
    needs: verify-frozen-protocol
    runs-on: ubuntu-22.04
    timeout-minutes: 235
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [pairwise, serial_onehot]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Yosys and OpenROAD
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys iverilog curl python3
          curl -fL --retry 3 --max-time 180 \
            https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb \
            -o /tmp/openroad-v296.deb
          sudo apt-get install -y /tmp/openroad-v296.deb
          mkdir -p build/v296/platform build/v296/tile_slice
      - name: Download frozen Nangate45 and OpenRCX platform
        run: |
          set -euo pipefail
          rev=eda8e552974d47a12616294dddf4012d892548d3
          base="https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$rev/flow/platforms/nangate45"
          curl -fL --retry 3 --max-time 180 "$base/lib/NangateOpenCellLibrary_typical.lib" -o build/v296/nangate.lib
          for f in NangateOpenCellLibrary.tech.lef NangateOpenCellLibrary.macro.mod.lef; do
            curl -fL --retry 3 --max-time 180 "$base/lef/$f" -o "build/v296/platform/$f"
          done
          curl -fL --retry 3 --max-time 180 "$base/make_tracks.tcl" -o build/v296/platform/make_tracks.tcl
          curl -fL --retry 3 --max-time 180 "$base/rcx_patterns.rules" -o build/v296/platform/rcx_patterns.rules
      - name: Verify identical diagnostic RTL and physical inputs
        run: |
          set -euo pipefail
          python3 research/v296/v296_density035_route_ablation.py --self-test --build
      - name: Run 210-minute bounded matched detailed route and preserve censoring
        env:
          V296_TILE_VARIANT: ${{ matrix.variant }}
        run: |
          set -uo pipefail
          export V296_OPENROAD_BIN="$(command -v openroad)"
          set +e
          timeout --signal=TERM --kill-after=30s 210m bash build/v296/tile_slice/run_bank_decode_density035.sh
          rc=$?
          set -e
          echo "V296_DENSITY035_EXTENDED_EXIT_CODE=$rc" | tee "build/v296/tile_slice/${V296_TILE_VARIANT}.density035.extended.exit.txt"
          # Preserve a right-censored tool run as evidence. Independent audit fails closed.
          exit 0
      - name: Preserve original complete and incomplete physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-density035-extended-${{ matrix.variant }}
          path: build/v296/tile_slice/
          if-no-files-found: warn
  independent-checkpoint:
    needs: [verify-frozen-protocol, matched-extended-route]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve both independently produced contestant artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v296-density035-extended-*
          path: build/v296/tile_slice/
          merge-multiple: true
      - name: Audit frozen iteration-3 gate and refuse missing controls
        run: |
          set -euo pipefail
          python3 research/v296/density035_control_censoring_sensitivity.py --self-test --report
          python3 research/v296/v296_density035_route_ablation.py --self-test
          python3 research/v296/v296_density035_route_ablation.py --audit build/v296/tile_slice/
      - name: Preserve prospective verdict or incomplete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-density035-extended-independent-verdict
          path: build/v296/tile_slice/density035_result.json
          if-no-files-found: warn
