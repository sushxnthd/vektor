name: V296 matched post-CTS endpoint diagnostic (no detailed route)
on:
  push:
    branches: [research/v296-pairwise-bank-conflict]
    paths:
      - 'research/v296/POSTCTS_ENDPOINT_DIAGNOSTIC_PREREG_20261026.md'
      - 'research/v296/endpoint_diag_flow.py'
      - '.github/workflows/v296-endpoint-diag.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-endpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [pairwise, serial_onehot]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned physical tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys iverilog curl python3
          curl -fL --retry 3 --max-time 180 \
            https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb \
            -o /tmp/openroad-v296.deb
          sudo apt-get install -y /tmp/openroad-v296.deb
          mkdir -p build/v296/platform build/v296/tile_slice
          sha256sum /tmp/openroad-v296.deb > build/v296/tile_slice/openroad.deb.sha256
      - name: Fetch original pinned Nangate45 and OpenRCX platform
        run: |
          set -euo pipefail
          rev=eda8e552974d47a12616294dddf4012d892548d3
          base="https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$rev/flow/platforms/nangate45"
          curl -fL --retry 3 --max-time 180 "$base/lib/NangateOpenCellLibrary_typical.lib" -o build/v296/nangate.lib
          for f in NangateOpenCellLibrary.tech.lef NangateOpenCellLibrary.macro.mod.lef; do
            curl -fL --retry 3 --max-time 180 "$base/lef/$f" -o "build/v296/platform/$f"
          done
          curl -fL --retry 3 --max-time 180 "$base/make_tracks.tcl" -o build/v296/platform/make_tracks.tcl
          curl -fL --retry 3 --max-time 180 "$base/rcx_patterns.rules" -o build/v296/platform/rcx_patterns.rules
      - name: Validate and generate matched diagnostic without modifying original flow
        run: |
          set -euo pipefail
          python3 research/v296/tile_slice_flow.py --self-test
          python3 research/v296/endpoint_diag_flow.py --self-test --build
          test -s build/v296/tile_slice/cts45_endpoint_diag.tcl
          test -s build/v296/tile_slice/run_endpoint_diag.sh
          ! grep -q 'detailed_route -output_drc' build/v296/tile_slice/cts45_endpoint_diag.tcl
      - name: Execute bounded post-CTS path localization
        env:
          V296_TILE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          export V296_OPENROAD_BIN="$(command -v openroad)"
          timeout --signal=TERM --kill-after=60s 70m \
            bash build/v296/tile_slice/run_endpoint_diag.sh
          log="build/v296/tile_slice/$V296_TILE_VARIANT.high.log"
          grep -q 'V296_ENDPOINT_DIAG_DONE' "$log"
          grep -q 'V296_ENDPOINT_DIAG_SETUP_PATHS_BEGIN' "$log"
          grep -q 'V296_ENDPOINT_DIAG_SETUP_PATHS_END' "$log"
          grep -q 'V296_ENDPOINT_DIAG_POSTCTS_ONLY_NO_ROUTE' \
            <(echo "V296_ENDPOINT_DIAG_POSTCTS_ONLY_NO_ROUTE $V296_TILE_VARIANT")
          test -s "build/v296/tile_slice/$V296_TILE_VARIANT.high.postcts_diag.def"
          echo "V296_ENDPOINT_DIAG_CHECKPOINT_COMPLETE_NO_SIGNOFF $V296_TILE_VARIANT"
      - name: Preserve successes and failed/censored logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-postcts-endpoint-${{ matrix.variant }}
          path: build/v296/tile_slice/
          if-no-files-found: warn
