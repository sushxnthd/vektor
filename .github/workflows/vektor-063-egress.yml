name: Vektor 063 validation
on: [push, workflow_dispatch]
jobs:
  test:
    if: github.ref == 'refs/heads/research/fence-egress-contention-063'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/063/tests/conservation_063.py
      - run: python3 research/063/tests/egress_ci_063.py
      - run: python3 research/063/tests/batch4_ci.py
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - run: iverilog -g2012 -s tb_fence_egress_063 -o /tmp/v063.vvp research/063/rtl/fence_egress_arbiter_063.sv research/063/rtl/tb_fence_egress_063.sv && vvp /tmp/v063.vvp
      - run: yosys -Q -p 'read_verilog -sv research/063/rtl/fence_egress_arbiter_063.sv; hierarchy -top fence_egress_arbiter_063; proc; opt; techmap; opt; stat'
