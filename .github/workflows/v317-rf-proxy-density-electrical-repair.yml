name: V317 matched RF-proxy density electrical repair challenge
on:
  push:
    branches: [research/v317-sass-provenance-gate]
    paths:
      - '.github/workflows/v317-rf-proxy-density-electrical-repair.yml'
      - 'research/v317/rtl/audit_rf_proxy_density_repair.py'
      - 'research/v317/FROZEN_RF_PROXY_DENSITY_ELECTRICAL_REPAIR_20261102.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-density-routes:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing 4096-cycle RTL equivalence and bank-port legality
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          mkdir -p build/v317/rf_proxy_density
          git rev-parse HEAD | tee build/v317/rf_proxy_density/source_sha.txt
          iverilog -g2012 -s tb_rf_proxy_banked_tile -o build/v317/rf_proxy_density/tb \
            rtl/vtile/steal_warp_scheduler.sv \
            rtl/vtile/issue_control.sv \
            rtl/vtile/rf_bank_arbiter.sv \
            research/v317/rtl/rf_bank_pairwise_credit.sv \
            research/v317/rtl/rf_integrated_issue_top.sv \
            research/v317/rtl/rf_proxy_banked_tile.sv \
            research/v317/rtl/tb_rf_proxy_banked_tile.sv
          vvp build/v317/rf_proxy_density/tb | tee build/v317/rf_proxy_density/rtl.log
          grep -q 'PASS V317 banked RF proxy cycles=4096' build/v317/rf_proxy_density/rtl.log
      - name: Pin the same official OpenROAD flow container
        shell: bash
        run: |
          set -euo pipefail
          image='openroad/orfs@sha256:9bd99a4657f491615a5a516a8de3352f8b82013a7d0788e0b244c233efd9f5b8'
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | tee build/v317/rf_proxy_density/container_digests.json
          printf '%s\n' "$image" > build/v317/rf_proxy_density/pinned_image.txt
      - name: Four matched full routes with frozen placement-density challenge
        shell: bash
        run: |
          set +e
          set -uo pipefail
          image='openroad/orfs@sha256:9bd99a4657f491615a5a516a8de3352f8b82013a7d0788e0b244c233efd9f5b8'
          failed=0
          for spec in 015:0.15 035:0.35; do
            label="${spec%%:*}"
            density="${spec#*:}"
            folder="build/v317/rf_proxy_density/density_${label}"
            mkdir -p "$folder"
            printf 'PLACE_DENSITY_LB_ADDON=%s\n' "$density" > "$folder/density_config.txt"
            for variant in source pairwise; do
              name="vektor_v317_rf_proxy_top_${variant}"
              dest="${folder}/rf_proxy_${variant}"
              for dir in results logs reports objects; do
                mkdir -p "${dest}/${dir}/nangate45/${name}/base"
              done
              printf 'START variant=%s density=%s\n' "$variant" "$density" > "${dest}/status.txt"
              docker run --rm \
                -v "$PWD:/work/vektor" \
                -e VEKTOR_ROOT=/work/vektor \
                -w /OpenROAD-flow-scripts/flow \
                "$image" bash -lc "source ../env.sh && make DESIGN_CONFIG=/work/vektor/research/v317/rtl/rf_proxy_banked_tile.mk DESIGN_NAME=${name} DIE_AREA='0 0 240 240' CORE_AREA='8 8 232 232' FLOW_VARIANT=base PLACE_DENSITY_LB_ADDON=${density} WORK_HOME=/work/vektor/${dest} -j1" \
                > "${dest}/make.log" 2>&1
              rc=$?
              printf 'exit_code=%s\n' "$rc" >> "${dest}/status.txt"
              if [ "$rc" -ne 0 ]; then
                failed=1
                tail -n 70 "${dest}/make.log" || true
              fi
            done
          done
          exit "$failed"
      - name: Independently audit extracted-RC electrical and area gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 research/v317/rtl/audit_rf_proxy_density_repair.py \
            build/v317/rf_proxy_density --repo . \
            --output build/v317/rf_proxy_density/audit.json
      - name: Preserve positive and negative physical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v317-rf-proxy-density-repair-nangate45
          path: build/v317/rf_proxy_density/
          retention-days: 30
          if-no-files-found: warn
