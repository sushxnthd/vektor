name: simulator

on:
  push:
    branches: [main, "research/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install "pytest>=8,<9"
      - run: pytest
      - name: Run V-Tile issue benchmark
        run: python benchmarks/vtile_issue_bench.py > vtile_issue_results.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: vtile-issue-results
          path: vtile_issue_results.json
