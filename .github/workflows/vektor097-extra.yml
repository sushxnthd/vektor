name: Vektor097 extended
on:
  push:
    branches: [research/ready-valid-097]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - run: python3 research/097/gen_vectors.py
      - run: bash research/097/run_extra.sh
