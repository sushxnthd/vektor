name: V297 bank-rescue prospective evidence
on:
  pull_request:
    paths:
      - 'research/v297/**'
      - '.github/workflows/v297-bank-rescue.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exhaustive JS oracle and synthetic prospective simulation
        run: |
          node research/v297/v297_bank_rescue.js --self-test
          node research/v297/v297_bank_rescue.js > /tmp/v297_reproduced.json
      - name: Independent Python checker and stored result reproduction
        run: |
          python3 research/v297/audit_v297_bank_rescue.py research/v297/V297_BOUNDED_BANK_RESCUE_RESULTS_20261028.json
          python3 research/v297/audit_v297_bank_rescue.py /tmp/v297_reproduced.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/v297_reproduced.json'))
          b=json.load(open('research/v297/V297_BOUNDED_BANK_RESCUE_RESULTS_20261028.json'))
          assert a==b, 'Stored V297 prospective result differs from fresh reproduction'
          print('V297_ORIGINAL_REPRODUCTION_PASS')
          PY
      - name: Reproduce adversarial rotating-serial control
        run: |
          node research/v297/v297_rotating_control.js > /tmp/v297_rotation_reproduced.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/v297_rotation_reproduced.json'))
          b=json.load(open('research/v297/V297_ROTATING_CONTROL_RESULTS_20261028.json'))
          assert a==b, 'Rotating-control heldout results differ from frozen record'
          assert a['results'][0]['candidateMinusRotation']>0
          assert a['results'][-1]['candidateMinusRotation']<0
          print('V297_STRONG_CONTROL_FALSIFICATION_REPRODUCED')
          PY
      - name: Reproduce frozen persistent queue and phase adversary
        run: |
          node research/v297/v297_persistent_queue.js > /tmp/v297_queue_reproduced.json
          node research/v297/v297_phase_adversary.js > /tmp/v297_phase_reproduced.json
          python3 - <<'PY'
          import json
          for script,stored in [
              ('/tmp/v297_queue_reproduced.json','research/v297/V297_PERSISTENT_QUEUE_RESULTS_20261029.json'),
              ('/tmp/v297_phase_reproduced.json','research/v297/V297_PHASE_ADVERSARY_RESULTS_20261029.json')]:
              a=json.load(open(script)); b=json.load(open(stored))
              assert a==b, f'mismatch {stored}'
              for row in a['rows']:
                  if 'policies' in row:
                      assert all(p['portViolations']==0 for p in row['policies'].values())
                  else:
                      assert row['candidate']['throughput']<=row['oracle']['throughput']+0.0001
          print('V297_QUEUE_AND_PHASE_REPRODUCTION_PASS')
          PY
      - name: Reproduce frozen Markov-law holdouts and failures
        run: |
          node research/v297/v297_markov_boundary.js > /tmp/v297_markov_reproduced.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/v297_markov_reproduced.json'))
          b=json.load(open('research/v297/V297_MARKOV_BOUNDARY_RESULTS_20261029.json'))
          assert a==b
          rows={r['regime']:r for r in a['rows']}
          assert rows['markov90']['markovWithinTolerance']
          assert not rows['periodic2of3']['markovWithinTolerance']
          assert not rows['burst11']['markovWithinTolerance']
          print('V297_MARKOV_LAW_AND_NEGATIVE_CONTROLS_REPRODUCED')
          PY
      - name: Reproduce exhaustive maxpair dominance and compact equivalence
        run: |
          node research/v297/v297_maxpair_dominance.js > /tmp/v297_dominance.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/v297_dominance.json'))
          b=json.load(open('research/v297/V297_MAXPAIR_DOMINANCE_RESULTS_20261029.json'))
          assert a==b
          assert a['canonicalCases']==11664
          assert a['compactMismatches']==0 and a['maxpairWorseCases']==0
          assert a['maxpairStrictlyBetterCases']>0
          print('V297_EXHAUSTIVE_MAXPAIR_DOMINANCE_PASS')
          PY
      - name: Install free RTL and generic synthesis tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog yosys
      - name: Independently verify clocked RTL against Python reference
        run: |
          python3 research/v297/rtl/v297_independent_trace.py /tmp/v297_rtl_vectors.txt
          iverilog -g2012 -Wall -s tb_v297 -o /tmp/v297_rtl_sim \
            research/v297/rtl/v297_bank_rescue_core.v research/v297/rtl/v297_maxpair_core.v research/v297/rtl/v297_maxpair_cooldown_core.v research/v297/rtl/tb_v297.v
          vvp /tmp/v297_rtl_sim
      - name: Generic synthesis of both matched-port contestants
        run: |
          yosys -Q -T -p 'read_verilog research/v297/rtl/v297_bank_rescue_core.v; chparam -set ROTATING 0 v297_bank_rescue_core; synth -top v297_bank_rescue_core; stat; ltp -noff' > /tmp/v297_candidate_synth.txt
          yosys -Q -T -p 'read_verilog research/v297/rtl/v297_bank_rescue_core.v; chparam -set ROTATING 1 v297_bank_rescue_core; synth -top v297_bank_rescue_core; stat; ltp -noff' > /tmp/v297_rotating_synth.txt
          grep -E 'Longest topological path|number of cells|\$\_AND_|\$\_OR_|\$\_MUX_' /tmp/v297_candidate_synth.txt | tail -n 20
          grep -E 'Longest topological path|number of cells|\$\_AND_|\$\_OR_|\$\_MUX_' /tmp/v297_rotating_synth.txt | tail -n 20
          yosys -Q -T -p 'read_verilog research/v297/rtl/v297_maxpair_core.v; synth -top v297_maxpair_core; stat; ltp -noff' > /tmp/v297_maxpair_synth.txt
          grep -E 'Longest topological path' /tmp/v297_maxpair_synth.txt | tail -n 3
          yosys -Q -T -p 'read_verilog research/v297/rtl/v297_maxpair_cooldown_core.v; synth -top v297_maxpair_cooldown_core; stat; ltp -noff' > /tmp/v297_compact_synth.txt
          grep -E 'Longest topological path' /tmp/v297_compact_synth.txt | tail -n 3
      - name: Display comparable generic gate counts (not physical timing or area)
        run: |
          echo 'CANDIDATE GENERIC SYNTHESIS STAT'
          grep -A28 -F '=== v297_bank_rescue_core ===' /tmp/v297_candidate_synth.txt | tail -n 32
          echo 'MAX-PAIR GENERIC SYNTHESIS STAT'
          grep -A28 -F '=== v297_maxpair_core ===' /tmp/v297_maxpair_synth.txt | tail -n 32
          echo 'COMPACT EQUIVALENT GENERIC SYNTHESIS STAT'
          grep -A28 -F '=== v297_maxpair_cooldown_core ===' /tmp/v297_compact_synth.txt | tail -n 32
          echo 'ROTATING GENERIC SYNTHESIS STAT'
          grep -A28 -F '=== v297_bank_rescue_core ===' /tmp/v297_rotating_synth.txt | tail -n 32
      - name: Matched Nangate45 liberty synthesis (no placement or RC)
        run: |
          set -euo pipefail
          rev=eda8e552974d47a12616294dddf4012d892548d3
          curl -fL --retry 3 --max-time 180 "https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$rev/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib" -o /tmp/v297_nangate.lib
          sha256sum /tmp/v297_nangate.lib | tee /tmp/v297_liberty.sha256
          yosys -Q -T -p 'read_verilog research/v297/rtl/v297_bank_rescue_core.v; chparam -set ROTATING 0 v297_bank_rescue_core; synth -top v297_bank_rescue_core -noabc; dfflibmap -liberty /tmp/v297_nangate.lib; abc -liberty /tmp/v297_nangate.lib; clean; stat -liberty /tmp/v297_nangate.lib; ltp -noff' > /tmp/v297_candidate_mapped.txt
          yosys -Q -T -p 'read_verilog research/v297/rtl/v297_bank_rescue_core.v; chparam -set ROTATING 1 v297_bank_rescue_core; synth -top v297_bank_rescue_core -noabc; dfflibmap -liberty /tmp/v297_nangate.lib; abc -liberty /tmp/v297_nangate.lib; clean; stat -liberty /tmp/v297_nangate.lib; ltp -noff' > /tmp/v297_rotating_mapped.txt
          yosys -Q -T -p 'read_verilog research/v297/rtl/v297_maxpair_core.v; synth -top v297_maxpair_core -noabc; dfflibmap -liberty /tmp/v297_nangate.lib; abc -liberty /tmp/v297_nangate.lib; clean; stat -liberty /tmp/v297_nangate.lib; ltp -noff' > /tmp/v297_maxpair_mapped.txt
          yosys -Q -T -p 'read_verilog research/v297/rtl/v297_maxpair_cooldown_core.v; synth -top v297_maxpair_cooldown_core -noabc; dfflibmap -liberty /tmp/v297_nangate.lib; abc -liberty /tmp/v297_nangate.lib; clean; stat -liberty /tmp/v297_nangate.lib; ltp -noff' > /tmp/v297_compact_mapped.txt
          for name in candidate rotating maxpair compact; do
            echo "MATCHED_NANGATE45_$name"
            grep -E 'Chip area for module|Longest topological path|Number of cells' "/tmp/v297_${name}_mapped.txt" | tail -n 5
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v297-generic-synthesis-evidence
          path: |
            /tmp/v297_candidate_synth.txt
            /tmp/v297_rotating_synth.txt
            /tmp/v297_maxpair_synth.txt
            /tmp/v297_compact_synth.txt
            /tmp/v297_*_mapped.txt
            /tmp/v297_liberty.sha256
          if-no-files-found: ignore
          retention-days: 30
