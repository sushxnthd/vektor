name: V296 deferred-write matched routed extracted-RC D4 D8
on:
  push:
    branches: [research/v296-pairwise-bank-conflict]
    paths:
      - 'research/v296/DEFERRED_WRITE_MATCHED_ROUTED_PREREG_20261028.md'
      - 'research/v296/deferred_write_routed.py'
      - '.github/workflows/v296-deferred-write-routed.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v296-deferred-routed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  provenance-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen strong control and fail-closed generator
        run: |
          set -euo pipefail
          python3 research/v296/tile_slice_flow.py --self-test
          python3 research/v296/deep_bank_postcts.py --self-test
          python3 research/v296/deferred_write_routed.py --self-test --build --word-bits 2
          grep -Fq 'serial_onehot) param=0; extra=1' build/v296/tile_slice/run_deferred_routed.sh
          grep -Fq 'detailed_route -output_drc' build/v296/tile_slice/cts45_hold25_tile.tcl
          grep -Fq 'extract_parasitics -ext_model_file' build/v296/tile_slice/cts45_hold25_tile.tcl
          grep -Fq 'repair_timing -hold -slack_margin 0.025' build/v296/tile_slice/cts45_hold25_tile.tcl
          grep -Fq 'V296_CTS45_FIFTH_DONE' build/v296/tile_slice/cts45_hold25_tile.tcl
  matched-route:
    needs: provenance-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        word_bits: [2, 3]
        variant: [pairwise, serial_onehot]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OpenROAD and Yosys
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys curl python3
          curl -fL --retry 3 --max-time 180 \
            https://github.com/Precision-Innovations/OpenROAD/releases/download/2024-12-14/openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb \
            -o /tmp/openroad-v296.deb
          sudo apt-get install -y /tmp/openroad-v296.deb
          mkdir -p build/v296/platform build/v296/tile_slice
          sha256sum /tmp/openroad-v296.deb > build/v296/tile_slice/openroad.deb.sha256
      - name: Fetch pinned Nangate45 technology and routing layers
        run: |
          set -euo pipefail
          rev=eda8e552974d47a12616294dddf4012d892548d3
          base="https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$rev/flow/platforms/nangate45"
          curl -fL --retry 3 --max-time 180 "$base/lib/NangateOpenCellLibrary_typical.lib" -o build/v296/nangate.lib
          for f in NangateOpenCellLibrary.tech.lef NangateOpenCellLibrary.macro.mod.lef; do
            curl -fL --retry 3 --max-time 180 "$base/lef/$f" -o "build/v296/platform/$f"
          done
          curl -fL --retry 3 --max-time 180 "$base/make_tracks.tcl" -o build/v296/platform/make_tracks.tcl
          curl -fL --retry 3 --max-time 180 "$base/rcx_patterns.rules" -o build/v296/platform/rcx_patterns.rules
      - name: Derive same-depth matched full-route contestants
        run: |
          set -euo pipefail
          python3 research/v296/deferred_write_routed.py --self-test --build --word-bits "${{ matrix.word_bits }}"
          test -s build/v296/tile_slice/run_deferred_routed.sh
          test -s build/v296/tile_slice/cts45_hold25_tile.tcl
      - name: Execute bounded matched CTS detailed-route extracted-RC
        env:
          V296_TILE_VARIANT: ${{ matrix.variant }}
          V296_DEEP_WORD_BITS: ${{ matrix.word_bits }}
        run: |
          set -uo pipefail
          export V296_OPENROAD_BIN="$(command -v openroad)"
          set +e
          timeout --signal=TERM --kill-after=60s 75m \
            bash build/v296/tile_slice/run_deferred_routed.sh
          rc=$?
          set -e
          echo "EXIT_CODE=$rc" | tee "build/v296/tile_slice/${V296_TILE_VARIANT}.deferred_routed.exit.txt"
          exit 0
      - name: Preserve original physical evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-deferred-routed-bits${{ matrix.word_bits }}-${{ matrix.variant }}
          path: |
            build/v296/tile_slice/*.high.log
            build/v296/tile_slice/*.synth.log
            build/v296/tile_slice/*.inputs.sha256
            build/v296/tile_slice/*.exit.txt
            build/v296/tile_slice/*.json
            build/v296/tile_slice/*.version
            build/v296/tile_slice/*.spef
            build/v296/tile_slice/*.def
            build/v296/tile_slice/*.drc
          if-no-files-found: warn
  independent-aggregate:
    needs: [provenance-preflight, matched-route]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        word_bits: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Download both same-depth original contestant artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v296-deferred-routed-bits${{ matrix.word_bits }}-*
          path: build/v296/tile_slice/
          merge-multiple: true
      - name: Independent original-source extracted-RC and electrical audit
        run: |
          set -euo pipefail
          python3 research/v296/deferred_write_routed.py --self-test
          python3 research/v296/deferred_write_routed.py --build --word-bits "${{ matrix.word_bits }}"
          python3 research/v296/deferred_write_routed.py --audit --word-bits "${{ matrix.word_bits }}"
      - name: Preserve positive or negative routed verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-deferred-routed-audit-bits${{ matrix.word_bits }}
          path: build/v296/tile_slice/aggregate.deferred_routed_bits*.json
          if-no-files-found: warn
