name: Vektor 089 cancellation regression
on:
  push:
    branches: ['research/wb-cancel-aba-089']
  pull_request:
    paths: ['experiments/wb_cancel_aba_089.py', 'tests/test_089.py', 'research/089/**']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_089.py' -v
      - run: python3 experiments/wb_cancel_aba_089.py > /tmp/results_089.json
