name: V296 deferred-write two-port RTL and matched mapped falsification
on:
  push:
    branches: [research/v296-pairwise-bank-conflict]
    paths:
      - 'research/v296/DEFERRED_WRITE_RF_RETIMING_PREREG_20261028.md'
      - 'research/v296/v296_tile_slice_deferred_write.sv'
      - 'research/v296/tb_v296_tile_slice_deferred_write.sv'
      - '.github/workflows/v296-deferred-write.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v296-deferred-write-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-rtl:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        word_bits: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install open simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Independent immediate-write oracle and collision stress
        run: |
          set -euo pipefail
          bits=${{ matrix.word_bits }}
          iverilog -g2012 -s tb_v296_tile_slice_deferred_write \
            -Ptb_v296_tile_slice_deferred_write.WORD_BITS="$bits" \
            -o /tmp/v296_deferred_write.vvp \
            rtl/vtile/steal_warp_scheduler.sv \
            research/v295/v295_issue_core.sv \
            research/v296/v296_issue_core.sv \
            research/v296/v296_tile_slice_deferred_write.sv \
            research/v296/tb_v296_tile_slice_deferred_write.sv
          vvp /tmp/v296_deferred_write.vvp | tee /tmp/v296_deferred_write_rtl.log
          depth=$((1 << bits))
          grep -q "V296_DEFERRED_WRITE_RTL_PASS depth=$depth cycles=2048" /tmp/v296_deferred_write_rtl.log
      - name: Preserve simulator evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-deferred-write-rtl-bits${{ matrix.word_bits }}
          path: /tmp/v296_deferred_write_rtl.log
          if-no-files-found: warn
  equal-resource-mapped:
    needs: independent-rtl
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        word_bits: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install open synthesis and pinned Nangate45 library
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys curl
          mkdir -p build/v296/deferred_write_mapped
          rev=eda8e552974d47a12616294dddf4012d892548d3
          curl -fL --retry 3 --max-time 180 \
            "https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/$rev/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib" \
            -o build/v296/deferred_write_mapped/nangate.lib
      - name: Matched mapped area and depth, no physical claims
        run: |
          set -euo pipefail
          out=build/v296/deferred_write_mapped
          bits=${{ matrix.word_bits }}
          yosys -V > "$out/yosys.version"
          sha256sum research/v296/v296_tile_slice_deferred_write.sv \
            research/v296/v296_issue_core.sv research/v295/v295_issue_core.sv \
            "$out/nangate.lib" > "$out/source_library.sha256"
          for spec in pairwise:1 serial:0; do
            IFS=: read -r name pairwise <<< "$spec"
            yosys -Q -T -p "read_liberty -lib -ignore_miss_func -ignore_miss_dir $out/nangate.lib; \
              read_verilog -sv rtl/vtile/steal_warp_scheduler.sv research/v295/v295_issue_core.sv \
                research/v296/v296_issue_core.sv research/v296/v296_tile_slice_deferred_write.sv; \
              hierarchy -top v296_tile_slice_deferred_write -chparam PAIRWISE $pairwise -chparam WORD_BITS $bits; \
              synth -top v296_tile_slice_deferred_write -flatten; \
              dfflibmap -liberty $out/nangate.lib; abc -liberty $out/nangate.lib; \
              clean; check -assert; stat -liberty $out/nangate.lib; ltp -noff" \
              > "$out/depth$((1 << bits))_$name.log" 2>&1
            grep -q 'Chip area' "$out/depth$((1 << bits))_$name.log"
          done
          echo "MAPPED_ONLY_NOT_EXTRACTED_PHYSICAL_SIGNOFF" > "$out/evidence_tier.txt"
      - name: Preserve synthesis evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v296-deferred-write-mapped-bits${{ matrix.word_bits }}
          path: build/v296/deferred_write_mapped/
          if-no-files-found: warn
